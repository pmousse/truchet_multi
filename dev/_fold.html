<!DOCTYPE html><html><head><meta charset="utf-8"></head>
<body><canvas id="c"></canvas><pre id="o"></pre>
<script src="../src/shaders.js"></script>
<script>
var SH = window.TruchetShaders, cv = document.getElementById('c');
var A = SH.hexToRGB('#101018'), B = SH.hexToRGB('#f4efe6');
var out = [];
function lum(v){return 0.2126*v[0]+0.7152*v[1]+0.0722*v[2];}
function run(key, mix, scrim){
  var g = SH.createGround(cv); g.setShader(key); g.resize(60,40);
  g.setParams({scale:1, mix:mix, scrim:scrim, seed:0.37, a:A, b:B});
  g.render(20);
  var c2=document.createElement('canvas'); c2.width=60; c2.height=40;
  var cx=c2.getContext('2d'); cx.drawImage(cv,0,0);
  var d=cx.getImageData(0,0,60,40).data;
  var mn=1e9,mx=-1e9,worst=0,wp=null;
  var dx=B[0]-A[0], dy=B[1]-A[1], dz=B[2]-A[2], dd=dx*dx+dy*dy+dz*dz;
  for(var i=0;i<d.length;i+=4){
    var L=lum([d[i],d[i+1],d[i+2]]); if(L<mn)mn=L; if(L>mx)mx=L;
    var r=d[i]/255,gg=d[i+1]/255,b=d[i+2]/255;
    var t=Math.min(1,Math.max(0,((r-A[0])*dx+(gg-A[1])*dy+(b-A[2])*dz)/dd));
    var e=Math.max(Math.abs(r-(A[0]+t*dx)),Math.abs(gg-(A[1]+t*dy)),Math.abs(b-(A[2]+t*dz)));
    if(e>worst){worst=e;wp=[d[i],d[i+1],d[i+2]];}
  }
  out.push(key+' mix'+mix+' scrim'+scrim+' lum '+mn.toFixed(0)+'..'+mx.toFixed(0)
    +' spread '+(mx-mn).toFixed(1)+' worstOffRamp '+(worst*255).toFixed(2)+' at '+wp);
}
run('mesh',0,0); run('mesh',1,0);
run('veil',0,0); run('veil',1,0);
run('wash',1,0);
run('ripple',1,0);
run('mesh',0,1); run('mesh',0,0.5); run('aurora',0,0.5);
document.getElementById('o').textContent = out.join('\n');
</script></body></html>
