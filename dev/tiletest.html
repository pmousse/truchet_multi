<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body>
<canvas id="cv"></canvas>
<script src="../src/engine.js"></script>
<script>
const q = (k, d) => (new URLSearchParams(location.hash.slice(1)).get(k)) ?? d;
const T = window.Truchet;
const cv = document.getElementById('cv');
const W = +q('W', 600), H = +q('H', 600);
cv.width = W; cv.height = H;
const ctx = cv.getContext('2d');
const pal = T.PALETTES[q('p', 'bw')] || T.PALETTES.bw;
ctx.fillStyle = pal[1]; ctx.fillRect(0, 0, W, H);
const N = +q('g', 2);
const tiles = [];
for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) tiles.push({ x: c, y: r, s: 1 });
T.fitTransform(ctx, tiles, W, H, +q('pd', 0.02));
/* m2 alternates two motifs on a checkerboard; mr=1&sd=<seed> picks between m1
 * and m2 at random per tile instead. Both are diagnostics: how a pair of tiles
 * is chosen changes the network the edges form, and for pairs whose tiles lean
 * opposite ways an alternating grid closes them into shapes rather than letting
 * them run. */
const m1 = q('m', '/');
const m2 = q('m2', null);
const rnd = q('mr', null) === '1'
  ? T.mulberry32(T.seedFromString(q('sd', 'pair')))
  : null;
T.renderTiling(ctx, tiles, {
  pickTile: m2 === null
    ? () => T.connIdxByName(m1)
    : (depth, t) => T.connIdxByName(rnd ? (rnd() < 0.5 ? m2 : m1)
      : (((t.x + t.y) % 2) ? m2 : m1)),
  palette: pal
});
</script>
</body>
</html>
