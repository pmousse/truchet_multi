<!doctype html>
<meta charset="utf-8">
<title>bench</title>
<body><pre id="out">running…</pre>
<script>window.onerror=function(m,u,l){document.getElementById('out').textContent='ERROR: '+m+' @'+u+':'+l;return true};</script>
<script src="../src/engine.js"></script>
<script>
/* Bench harness: drives src/engine.js through exactly the app's code paths
   (lattice -> buildTiling -> pickTile -> renderTiling) and times each stage.
   Mirror of src/app.js: MAX_LATTICE_SIDE / MAX_LATTICE_TILES caps, cover
   scaling in drawScene, bounds passed to renderTiling. */
'use strict';
const T = window.Truchet;
const MAX_LATTICE_SIDE = 64, MAX_LATTICE_TILES = 5000;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const SEED = 'k7x2m9';

function latticeMaxT(p, q) {
  const bySide = Math.max(1, Math.floor(MAX_LATTICE_SIDE / Math.max(p, q)));
  const byTiles = Math.max(1, Math.floor(Math.sqrt(MAX_LATTICE_TILES / (p * q))));
  return Math.max(1, Math.min(16, bySide, byTiles));
}
function lattice(p, q, n) {
  const t = clamp(Math.round(n) || 1, 1, latticeMaxT(p, q));
  return { cols: p * t, rows: q * t, t };
}
function buildTiling(kind, L) {
  switch (kind) {
    case 'chk': return T.checkerboardTiling(L.cols, L.rows);
    case 'grid': return T.gridTiling(L.rows, L.cols);
    case 'rand': {
      const rnd = T.mulberry32(T.seedFromString(SEED));
      const nSplit = Math.max(1, Math.round(3 * L.cols * L.rows / 10));
      return T.randomSubdivision(rnd, nSplit, 3, T.gridTiling(L.rows, L.cols));
    }
    case 'sur': return T.surroundTiling(L.cols, L.rows);
    case 'off': return T.offsetSurroundTiling(L.rows, L.cols);
  }
  return T.checkerboardTiling(4, 4);
}
function buildPicker(tiles) {
  const pool = T.MOTIF_NAMES;                    // 'mix'
  const rnd = T.mulberry32(T.seedFromString(SEED + '\u0001mix'));
  const map = new Map();
  const sorted = tiles.slice().sort((a, b) => (a.x - b.x) || (a.y - b.y) || (a.s - b.s));
  for (const t of sorted) map.set(t.x + ',' + t.y + ',' + t.s, T.NAMED_TILES[pool[Math.floor(rnd() * pool.length)]]);
  return (depth, t) => map.get(t.x + ',' + t.y + ',' + t.s) || T.connIdxByName('/');
}
function worldBounds(tiles, padPct) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const t of tiles) {
    const m = t.s / 3 + t.s * 0.02;
    x0 = Math.min(x0, t.x - m); y0 = Math.min(y0, t.y - m);
    x1 = Math.max(x1, t.x + t.s + m); y1 = Math.max(y1, t.y + t.s + m);
  }
  const p = (padPct / 100) * (x1 - x0);
  return [x0 - p, y0 - p, x1 + p, y1 + p];
}
function paint(canvas, tiles, w, h) {
  const cx = canvas.getContext('2d');
  cx.setTransform(1, 0, 0, 1, 0, 0);
  cx.fillStyle = T.PALETTES.bw[1];
  cx.fillRect(0, 0, w, h);
  const [x0, y0, x1, y1] = worldBounds(tiles, 2);
  const bw = x1 - x0, bh = y1 - y0;
  const s = Math.max(w / bw, h / bh);
  const winW = w / s, winH = h / s;
  const wx0 = (x0 + x1) / 2 - winW / 2, wy0 = (y0 + y1) / 2 - winH / 2;
  cx.setTransform(s, 0, 0, -s, -s * wx0, h + s * wy0);
  T.renderTiling(cx, tiles, {
    pickTile: buildPicker(tiles),
    palette: T.PALETTES.bw,
    bounds: [wx0, wy0, wx0 + winW, wy0 + winH]
  });
}
const median = (a) => a.slice().sort((x, y) => x - y)[a.length >> 1];

function runOne(kind, p, q, res, n) {
  const w = p >= q ? res : Math.max(1, Math.round(res * p / q));
  const h = p >= q ? Math.max(1, Math.round(res * q / p)) : res;
  let t0 = performance.now();
  const L = lattice(p, q, n);
  const tiles = buildTiling(kind, L);
  const tBuild = performance.now() - t0;
  let t1 = performance.now();
  buildPicker(tiles);
  const tPick = performance.now() - t1;
  const cvs = document.createElement('canvas');
  cvs.width = w; cvs.height = h;
  const paints = [];
  for (let i = 0; i < 3; i++) {
    const a = performance.now();
    paint(cvs, tiles, w, h);
    paints.push(performance.now() - a);
  }
  const tPaint = median(paints);
  return `${kind}\t${p}:${q}\tx${L.t}\t${tiles.length} tiles\t${w}x${h}\t` +
    `build ${tBuild.toFixed(1)}ms\tpick ${tPick.toFixed(1)}ms\t` +
    `paint ${tPaint.toFixed(1)}ms\ttotal ${(tBuild + tPick + tPaint).toFixed(1)}ms`;
}

window.addEventListener('load', () => {
  const lines = [];
  lines.push('# format\tlattice\tscale\ttiles\tpixels\tstage timings (paint = median of 3)');
  const cases = [
    ['16:9 chk x1', 'chk', 16, 9, 3840, 1],
    ['16:9 chk x2', 'chk', 16, 9, 3840, 2],
    ['16:9 chk x4', 'chk', 16, 9, 3840, 4],
    ['16:9 rand x4', 'rand', 16, 9, 3840, 4],
    ['16:9 sur x4', 'sur', 16, 9, 3840, 4],
    ['9:16 chk x4', 'chk', 9, 16, 3840, 4],
    ['1:1 chk x16', 'chk', 1, 1, 3840, 16],
    ['16:9 chk x4 @2K', 'chk', 16, 9, 2048, 4]
  ];
  for (const [, kind, p, q, res, n] of cases) lines.push(runOne(kind, p, q, res, n));
  lines.push('');
  lines.push('# interactive latency at screen size (preview canvas, dpr 1)');
  for (const [p, q, n] of [[16, 9, 1], [16, 9, 4], [1, 1, 16], [9, 16, 4]]) {
    const kind = 'chk';
    const L = lattice(p, q, n);
    const w = p >= q ? 1280 : Math.round(1280 * p / q), h = p >= q ? Math.round(1280 * q / p) : 1280;
    const cvs = document.createElement('canvas');
    cvs.width = w; cvs.height = h;
    /* one complete redraw, exactly what a slider tick costs: lattice + tiling +
       motif assignment + paint */
    const t0 = performance.now();
    const tiles = buildTiling(kind, L);
    paint(cvs, tiles, w, h);
    const tFull = performance.now() - t0;
    const paints = [];
    for (let i = 0; i < 5; i++) { const a = performance.now(); paint(cvs, tiles, w, h); paints.push(performance.now() - a); }
    lines.push(`${kind} ${p}:${q} x${L.t}  ${tiles.length} tiles  ${w}x${h}px  ` +
      `one full redraw ${tFull.toFixed(1)}ms  paint only, steady ${median(paints).toFixed(1)}ms`);
  }
  document.getElementById('out').textContent = lines.join('\n');
});
</script>
</body>
